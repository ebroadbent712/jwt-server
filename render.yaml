# Render blueprint for justwearthis.co (one web service: site, smart links, client pages, publish connector)
services:
  - type: web
    name: jwt-server
    runtime: python
    plan: starter            # $7/mo: stays awake (free instances sleep after 15 min)
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_BASE
        value: https://justwearthis.co
      - key: ADMIN_TOKEN
        sync: false           # Emily pastes her own value in the Render dashboard
      # Family version (Emily pastes each one in the Render dashboard; never in the code)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false
    disk:
      name: jwt-data
      mountPath: /var/data
      sizeGB: 1
